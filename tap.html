<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Skyfall Creations</title>
  <style>
    html,body{height:100%;margin:0}
    body{
      display:grid;place-items:center;
      background:#020711;color:#eef6ff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    .box{text-align:center;padding:24px}
    .dot{
      width:12px;height:12px;border-radius:50%;
      background:#20bfff;box-shadow:0 0 18px #20bfff;
      margin:0 auto 14px;
    }
    p{margin:0;color:#9fb1ca}
  </style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <p>Opening Skyfall Creations…</p>
  </div>

<script>
(function () {
  const ua = navigator.userAgent || "";
  const isIOS =
    /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  if (isIOS) {
    window.location.replace("/Brian-Secord.vcf");
  } else {
    window.location.replace("/skyfall_business_card.html");
  }
})();
</script>
</body>
</html>
